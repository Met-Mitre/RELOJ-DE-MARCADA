  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, Roboto, "Segoe UI", Arial, sans-serif;
           background: #f5f5f4; color: #1c1917; min-height: 100vh; display: flex; justify-content: center; }
    .wrap { width: 100%; max-width: 420px; padding: 24px 20px 40px; }
    .logo { display: block; margin: 0 auto 4px; width: 110px; height: auto; mix-blend-mode: multiply; }
    h1 { font-size: 13px; font-weight: 700; margin: 0; color: #ff6600; text-align: center; letter-spacing: 2px; }
    #reloj { font-size: 60px; color: #1c1917; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; margin: 8px 0 0; }
    #fecha { text-align: center; color: #78716c; margin-bottom: 24px; text-transform: capitalize; }
    label { display: block; font-size: 13px; color: #57534e; font-weight: 600; margin: 14px 0 6px; }
    input { width: 100%; padding: 14px; font-size: 18px; border-radius: 12px; border: 1px solid #d6d3d1;
            background: #fff; color: #1c1917; outline: none; }
    input:focus { border-color: #ff6600; box-shadow: 0 0 0 3px rgba(255,102,0,.15); }
    .rec { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: #78716c; }
    .rec input { accent-color: #ff6600; }
    .rec input { width: auto; }
    #hola { text-align: center; margin: 18px 0 0; min-height: 22px; color: #44403c; font-size: 15px; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    button { padding: 22px 10px; font-size: 20px; font-weight: 700; border: none; border-radius: 16px;
             color: #fff; cursor: pointer; transition: transform .05s, opacity .2s; }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .45; }
    #bEntrada { background: #16a34a; }
    #bSalida  { background: #dc2626; }
    button.sug { box-shadow: 0 0 0 4px #ff6600; }
    #camWrap { position: relative; width: 150px; height: 150px; margin: 0 auto 6px; border-radius: 50%;
               overflow: hidden; background: #e7e5e4; border: 3px solid #ff6600; }
    #cam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #camMsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
              text-align: center; font-size: 12px; color: #57534e; padding: 14px; }
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
    #gps { text-align: center; font-size: 13px; color: #a8a29e; margin-top: 14px; min-height: 18px; }
    #msg { margin-top: 18px; padding: 16px; border-radius: 14px; text-align: center; font-size: 16px; display: none; line-height: 1.4; }
    #msg.ok  { display: block; background: #f0fdf4; border: 1px solid #16a34a; color: #14532d; }
    #msg.err { display: block; background: #fef2f2; border: 1px solid #dc2626; color: #7f1d1d; }
    #msg.info{ display: block; background: #fff7ed; border: 1px solid #ff6600; color: #7c2d12; }
    #msg b { font-size: 22px; display: block; margin-bottom: 4px; }
  </style>
</head>

    <h1>RELOJ DE MARCACIÓN</h1>
    <div id="reloj">--:--</div>
    <div id="fecha"></div>

    <div id="camWrap"><video id="cam" autoplay playsinline muted></video><div id="camMsg">Activando cámara…</div></div>
    <canvas id="cv" style="display:none"></canvas>
    <div id="flash"></div>

    <label for="id">DNI / Legajo</label>
    <input id="id" inputmode="numeric" autocomplete="username" placeholder="Ej: 30111222">

    <div id="pinBox">
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
    </div>

    <div class="rec"><input type="checkbox" id="recordar" checked><span>Recordar mis datos en este celular</span></div>

    <div id="hola"></div>

    <div class="btns">
      <button id="bEntrada" onclick="marcar('Entrada')">ENTRADA</button>
      <button id="bSalida"  onclick="marcar('Salida')">SALIDA</button>
    </div>

    <div id="gps"></div>
    <div id="msg"></div>
  </div>

<script>
  // URL de tu Apps Script (la que termina en /exec)
  var API_URL = 'https://script.google.com/macros/s/AKfycbwu7_okOSk5eKcuwAngGTuoDagIW1FIthmBPtxXNj6S-MMm8oLAgbWbk4UgEUpfbQEAfA/exec';

  function api(datos) {
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(datos),
      credentials: 'omit',
      redirect: 'follow'
    }).then(function (r) { return r.json(); });
  }

  var USAR_PIN = false; // true = pide PIN además del DNI (activarlo también en Code.gs)
  var $ = function (id) { return document.getElementById(id); };
  if (!USAR_PIN) $('pinBox').style.display = 'none';

  // ---- Cámara (selfie al marcar) ----
  var FOTO_OBLIGATORIA = false; // true = no deja marcar sin foto
  var stream = null;
  function camMsg(t) { $('camMsg').style.display = 'flex'; $('camMsg').textContent = t; }
  function iniciarCamara() {
    if (stream) return Promise.resolve();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      camMsg('Este navegador no permite usar la cámara');
      return Promise.reject(new Error('sin camara'));
    }
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 640 } }, audio: false })
      .then(function (s) {
        stream = s; $('cam').srcObject = s; $('camMsg').style.display = 'none';
        return new Promise(function (ok) { $('cam').onloadedmetadata = function () { $('cam').play(); ok(); }; setTimeout(ok, 1500); });
      })
      .catch(function (e) { camMsg('Tocá aquí y permití la cámara'); throw e; });
  }
  function sacarFoto() {
    var v = $('cam');
    if (!stream || !v.videoWidth) return null;
    var lado = Math.min(v.videoWidth, v.videoHeight), w = 400;
    var c = $('cv'); c.width = w; c.height = w;
    var x = c.getContext('2d');
    x.drawImage(v, (v.videoWidth - lado) / 2, (v.videoHeight - lado) / 2, lado, lado, 0, 0, w, w);
    $('flash').style.opacity = .8; setTimeout(function () { $('flash').style.opacity = 0; }, 150);
    return c.toDataURL('image/jpeg', 0.6);
  }
  $('camWrap').addEventListener('click', function () { iniciarCamara().catch(function () {}); });
  iniciarCamara().catch(function () {});

  // ---- Reloj en pantalla ----
  function tick() {
    var d = new Date();
    $('reloj').textContent = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    $('fecha').textContent = d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  tick(); setInterval(tick, 1000);

  // ---- Recordar datos (si el navegador lo permite) ----
  function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function leer(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function borrar(k) { try { localStorage.removeItem(k); } catch (e) {} }

  $('id').value = leer('rm_id');
  $('pin').value = leer('rm_pin');

  // ---- Consulta el estado para sugerir el botón ----
  var tEstado;
  function estado() {
    clearTimeout(tEstado);
    tEstado = setTimeout(function () {
      var id = $('id').value.trim(), pin = $('pin').value.trim();
      $('bEntrada').classList.remove('sug'); $('bSalida').classList.remove('sug');
      if (!id || (USAR_PIN && !pin)) { $('hola').textContent = ''; return; }
      api({ accion: 'estado', id: id, pin: pin }).then(function (r) {
        if (!r || !r.ok) { $('hola').textContent = ''; return; }
        $('hola').innerHTML = 'Hola, <b>' + esc(r.nombre) + '</b>' +
          (r.ultimoTipo ? '<br><small>Última: ' + r.ultimoTipo + ' ' + r.ultimaHora + '</small>' : '');
        $(r.sugerido === 'Salida' ? 'bSalida' : 'bEntrada').classList.add('sug');
      }).catch(function () {});
    }, 400);
  }
  $('id').addEventListener('input', estado);
  $('pin').addEventListener('input', estado);
  estado();

  // Precalienta el GPS para que la marcación sea más rápida
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function (p) {
      $('gps').textContent = 'GPS listo (±' + Math.round(p.coords.accuracy) + ' m)';
    }, function () {}, { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
  }

  // ---- Marcar ----
  function marcar(tipo) {
    var id = $('id').value.trim(), pin = $('pin').value.trim();
    if (!id) return mostrar('err', 'Ingresá tu DNI/legajo.');
    if (USAR_PIN && !pin) return mostrar('err', 'Ingresá tu PIN.');
    if (!navigator.geolocation) return mostrar('err', 'Este navegador no permite obtener la ubicación.');

    bloquear(true);
    mostrar('info', 'Preparando cámara…');

    iniciarCamara().then(function () { return sacarFoto(); }, function () { return null; }).then(function (foto) {
    if (!foto && FOTO_OBLIGATORIA) {
      bloquear(false);
      return mostrar('err', 'Para marcar tenés que permitir la cámara. Tocá el círculo de arriba y elegí "Permitir". Si antes elegiste "Nunca", habilitala en los permisos del sitio.');
    }
    mostrar('info', 'Obteniendo ubicación…');

    navigator.geolocation.getCurrentPosition(function (p) {
      mostrar('info', 'Registrando ' + tipo.toLowerCase() + '…');
      api({ accion: 'marcar', id: id, pin: pin, tipo: tipo,
            lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy,
            ua: navigator.userAgent, foto: foto })
        .then(function (r) {
          bloquear(false);
          if (r.ok) {
            if ($('recordar').checked) { guardar('rm_id', id); guardar('rm_pin', pin); }
            else { borrar('rm_id'); borrar('rm_pin'); }
            mostrar('ok', '<b>✔ ' + r.msg + '</b>' + esc(r.nombre) + '<br>' + r.hora + ' hs · ' + r.fecha + '<br><small>' + esc(r.sede) + '</small>');
            if (navigator.vibrate) navigator.vibrate(150);
            estado();
          } else {
            mostrar('err', esc(r.msg));
          }
        })
        .catch(function (e) {
          bloquear(false);
          mostrar('err', 'Error de conexión. Revisá que tengas internet e intentá de nuevo.');
        });
    }, function (e) {
      bloquear(false);
      var t = e.code === 1 ? 'Necesitás permitir el acceso a la ubicación. Revisá los permisos del navegador para este sitio y volvé a intentar.'
            : e.code === 3 ? 'El GPS tardó demasiado. Verificá que esté activado e intentá de nuevo.'
            : 'No se pudo obtener la ubicación. Activá el GPS e intentá de nuevo.';
      mostrar('err', t);
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    });
  }

  function bloquear(b) { $('bEntrada').disabled = b; $('bSalida').disabled = b; }
  function mostrar(cls, html) { var m = $('msg'); m.className = cls; m.innerHTML = html; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
</script>
</body>
</html>
